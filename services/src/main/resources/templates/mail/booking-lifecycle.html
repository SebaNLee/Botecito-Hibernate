<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${heading}">Booking update</title>
</head>

<body
  style="margin: 0; padding: 0; background-color: #0b1c32; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased;">
  <table role="presentation" width="100%" border="0" cellspacing="0" cellpadding="0"
    style="background-color: #0b1c32;">
    <tr>
      <td align="center" style="padding: 60px 24px;">
        <div
          style="max-width: 600px; margin: 0 auto; background-color: #ffffff; border-radius: 24px; overflow: hidden; border: 1px solid #e2e8f0; box-shadow: 0 24px 48px rgba(0,0,0,0.15);">
          <table role="presentation" width="100%" border="0" cellspacing="0" cellpadding="0"
            style="border-collapse: collapse;">
            <tr>
              <td style="height: 6px; background-color: #005da7;"></td>
            </tr>
            <tr>
              <td style="padding: 40px;">
                <p
                  style="margin: 0 0 12px; font-size: 12px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; color: #005da7;">
                  <span th:text="#{mail.brand.name}">Botecito</span></p>
                <h1
                  style="margin: 0 0 16px; font-size: 28px; font-weight: 800; line-height: 1.2; color: #0b1c32;">
                  <span th:text="${heading}">Booking update</span></h1>
                <p style="margin: 0 0 12px; font-size: 16px; line-height: 1.6; color: #334155;"
                  th:text="#{mail.booking.greeting(${recipientName})}">Hello,</p>
                <p style="margin: 0 0 18px; font-size: 15px; line-height: 1.6; color: #475569;"
                  th:text="${body}">
                  Your booking was updated.
                </p>
                <table role="presentation" width="100%" border="0" cellspacing="0" cellpadding="0"
                  style="margin: 0 0 22px; border-collapse: collapse; background-color: #f8fafc; border: 1px solid #e2e8f0;">
                  <tr>
                    <td style="padding: 14px 16px;">
                      <p style="margin: 0 0 6px; font-size: 13px; font-weight: 700; color: #0b1c32;"
                        th:text="${itemTitle}">Boat</p>
                      <p style="margin: 0; font-size: 13px; color: #64748b;"
                        th:text="${bookingDate + ' (' + timezone + ')'}">Date</p>
                    </td>
                  </tr>
                </table>
                <p th:if="${message != null and !#strings.isEmpty(message)}"
                  style="margin: 0 0 16px; padding: 12px 14px; font-size: 14px; line-height: 1.5; color: #475569; background-color: #f8fafc; border-left: 3px solid #005da7;"
                  th:text="${message}">Message</p>
                <p th:if="${paymentReply != null and !#strings.isEmpty(paymentReply)}"
                  style="margin: 0 0 16px; padding: 12px 14px; font-size: 14px; line-height: 1.5; color: #475569; background-color: #f8fafc; border-left: 3px solid #005da7;"
                  th:text="${paymentReply}">Payment reply</p>
                <p th:if="${refusalReason != null and !#strings.isEmpty(refusalReason)}"
                  style="margin: 0 0 16px; padding: 12px 14px; font-size: 14px; line-height: 1.5; color: #475569; background-color: #fff7ed; border-left: 3px solid #ae3123;"
                  th:text="${refusalReason}">Refusal reason</p>
                <table role="presentation" border="0" cellspacing="0" cellpadding="0">
                  <tr>
                    <td>
                      <a th:href="${actionUrl}"
                        style="display: inline-block; padding: 14px 28px; border-radius: 9999px; background-color: #005da7; color: #ffffff; text-decoration: none; font-size: 15px; font-weight: 700;"
                        th:text="${action}">View booking</a>
                    </td>
                  </tr>
                </table>
                <p style="margin: 24px 0 0; font-size: 13px; line-height: 1.6; color: #64748b;"
                  th:text="${note}">
                  You can review this from your account.
                </p>
              </td>
            </tr>
          </table>
        </div>
      </td>
    </tr>
  </table>
</body>

</html>
