<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="#{mail.publishConfirmation.title}">Publication Confirmation</title>
</head>

<body
  style="margin: 0; padding: 0; background-color: #0b1c32; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased;">
  <table role="presentation" width="100%" border="0" cellspacing="0" cellpadding="0"
    background="https://lh3.googleusercontent.com/aida-public/AB6AXuDZ5Kqd4fIKaFZvY-voq31ImCLWMzSnpeVGHpeEyaXd8kXtZiSFMnnKueB6HamkvchzGHcdtKloU7aDgr0MGxnoT_9ajOLMji0wPSC7yQ5emqwmkA73GZQCbn35o0UxfJBxyeJdhr-pzL1EEkw8LCF2DcdIJfVaWRcu-RoozLWsJ5ORG87g28BMPR4QUAoyt2LvbzVgTrE-Am1XsXBjgD1E9SEkR7OkE9HuWK0S0ggwcliJWi00H0b6vl-7cuPGDQ0UDBDUBgelxxN5"
    style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuDZ5Kqd4fIKaFZvY-voq31ImCLWMzSnpeVGHpeEyaXd8kXtZiSFMnnKueB6HamkvchzGHcdtKloU7aDgr0MGxnoT_9ajOLMji0wPSC7yQ5emqwmkA73GZQCbn35o0UxfJBxyeJdhr-pzL1EEkw8LCF2DcdIJfVaWRcu-RoozLWsJ5ORG87g28BMPR4QUAoyt2LvbzVgTrE-Am1XsXBjgD1E9SEkR7OkE9HuWK0S0ggwcliJWi00H0b6vl-7cuPGDQ0UDBDUBgelxxN5'); background-size: cover; background-position: center;">
    <tr>
      <td align="center" style="padding: 60px 24px; background-color: rgba(11, 28, 50, 0.5);">
        <div
          style="max-width: 600px; margin: 0 auto; background-color: #ffffff; border-radius: 24px; overflow: hidden; border: 1px solid #e2e8f0; box-shadow: 0 24px 48px rgba(0,0,0,0.15);">
          <table role="presentation" width="100%" border="0" cellspacing="0" cellpadding="0"
            style="border-collapse: collapse;">
            <tr>
              <td style="height: 6px; background-color: #005da7;"></td>
            </tr>
            <tr>
              <td style="padding: 40px;">
                <div
                  style="display: inline-block; padding: 6px 12px; background-color: #f0f6fc; border-radius: 9999px; margin-bottom: 20px;">
                  <p
                    style="margin: 0; font-size: 11px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; color: #005da7;">
                    <span th:text="#{mail.brand.dev}">Botecito Dev</span></p>
                </div>
                <h1
                  style="margin: 0 0 16px; font-size: 28px; font-weight: 800; line-height: 1.2; color: #0b1c32; letter-spacing: -0.02em;">
                  <span th:text="#{mail.publishConfirmation.heading}">Your publication summary is ready</span></h1>
                <p style="margin: 0 0 12px; font-size: 16px; line-height: 1.6; color: #334155;"
                  th:text="#{mail.publishConfirmation.greeting(${ownerName})}">Hello Jane Doe,</p>
                <p style="margin: 0 0 16px; font-size: 16px; line-height: 1.6; color: #475569;"
                  th:text="#{mail.publishConfirmation.body(${itemTitle})}">
                  We received your publication and it is pending email confirmation.
                </p>
                <p style="margin: 0 0 28px; font-size: 15px; line-height: 1.6; color: #64748b;"
                  th:text="#{mail.publishConfirmation.note}">
                  Confirm it from this email to publish it, or delete it if you did not request it.
                </p>
                <table role="presentation" border="0" cellspacing="0" cellpadding="0">
                  <tr>
                    <td style="padding-right: 16px;">
                      <a th:href="${confirmUrl}"
                        style="display: inline-block; padding: 14px 28px; border-radius: 9999px; background-color: #005da7; color: #ffffff; text-decoration: none; font-size: 15px; font-weight: 700;"
                        th:text="#{mail.publishConfirmation.action}">Confirm publication</a>
                    </td>
                    <td>
                      <a th:href="${deleteUrl}"
                        style="display: inline-block; padding: 14px 28px; border-radius: 9999px; background-color: #ffffff; color: #dc2626; border: 2px solid #dc2626; text-decoration: none; font-size: 15px; font-weight: 700;"
                        th:text="#{mail.publishConfirmation.delete}">Delete publication</a>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
          </table>
        </div>
      </td>
    </tr>
  </table>
</body>

</html>
