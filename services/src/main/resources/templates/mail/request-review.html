<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body style="margin: 0; padding: 24px; background: #f8fafc; color: #0f172a; font-family: Arial, sans-serif;">
  <table role="presentation" style="width: 100%; border-collapse: collapse;">
    <tr>
      <td align="center">
        <table role="presentation" style="width: 100%; max-width: 640px; border-collapse: collapse; background: #ffffff; border: 1px solid #e2e8f0; border-radius: 16px;">
          <tr>
            <td style="padding: 32px;">
              <p style="margin: 0 0 12px; font-size: 14px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #0f766e;">Botecito</p>
              <h1 style="margin: 0 0 24px; font-size: 28px; line-height: 1.2;">New request received</h1>

              <table role="presentation" style="width: 100%; border-collapse: collapse; margin-bottom: 24px;">
                <tr>
                  <td style="padding: 0 0 8px; font-size: 14px; font-weight: 700; color: #475569;">Name</td>
                </tr>
                <tr>
                  <td th:text="${request.requesterName}" style="padding: 0 0 16px; font-size: 16px; color: #0f172a;"></td>
                </tr>
                <tr>
                  <td style="padding: 0 0 8px; font-size: 14px; font-weight: 700; color: #475569;">Email</td>
                </tr>
                <tr>
                  <td th:text="${request.requesterEmail}" style="padding: 0 0 16px; font-size: 16px; color: #0f172a;"></td>
                </tr>
                <tr>
                  <td style="padding: 0 0 8px; font-size: 14px; font-weight: 700; color: #475569;">Description</td>
                </tr>
                <tr>
                  <td th:text="${request.description}" style="padding: 0; font-size: 16px; line-height: 1.6; color: #0f172a; white-space: pre-wrap;"></td>
                </tr>
              </table>

              <table role="presentation" style="border-collapse: collapse;">
                <tr>
                  <td style="padding-right: 12px;">
                    <a th:href="${acceptUrl}" style="display: inline-block; padding: 12px 20px; border-radius: 8px; background: #059669; color: #ffffff; text-decoration: none; font-size: 14px; font-weight: 700;">Accept</a>
                  </td>
                  <td>
                    <a th:href="${declineUrl}" style="display: inline-block; padding: 12px 20px; border-radius: 8px; background: #dc2626; color: #ffffff; text-decoration: none; font-size: 14px; font-weight: 700;">Decline</a>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
