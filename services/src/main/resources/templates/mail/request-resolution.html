<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body style="margin: 0; padding: 24px; background: #f8fafc; color: #0f172a; font-family: Arial, sans-serif;">
  <table role="presentation" style="width: 100%; border-collapse: collapse;">
    <tr>
      <td align="center">
        <table role="presentation" style="width: 100%; max-width: 640px; border-collapse: collapse; background: #ffffff; border: 1px solid #e2e8f0; border-radius: 16px;">
          <tr>
            <td style="padding: 32px;">
              <p style="margin: 0 0 12px; font-size: 14px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #0f766e;">Botecito</p>
              <h1 style="margin: 0 0 16px; font-size: 28px; line-height: 1.2;">Request update</h1>
              <p style="margin: 0 0 24px; font-size: 16px; line-height: 1.6; color: #334155;">
                Hello <span th:text="${request.requesterName}"></span>, your request was
                <strong th:text="${statusLabel}" style="color: #0f172a;"></strong>.
              </p>

              <div style="padding: 20px; border-radius: 12px; background: #f8fafc; border: 1px solid #e2e8f0;">
                <p style="margin: 0 0 8px; font-size: 14px; font-weight: 700; color: #475569;">Description</p>
                <p th:text="${request.description}" style="margin: 0; font-size: 16px; line-height: 1.6; color: #0f172a; white-space: pre-wrap;"></p>
              </div>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
