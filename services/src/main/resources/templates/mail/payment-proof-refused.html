<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="#{mail.paymentProofRefused.title}">Payment proof refused</title>
</head>

<body
  style="margin: 0; padding: 0; background-color: #0b1c32; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased;">
  <table role="presentation" width="100%" border="0" cellspacing="0" cellpadding="0">
    <tr>
      <td align="center" style="padding: 60px 24px; background-color: #0b1c32;">
        <div
          style="max-width: 600px; margin: 0 auto; background-color: #ffffff; border-radius: 24px; overflow: hidden; border: 1px solid #e2e8f0; box-shadow: 0 24px 48px rgba(0,0,0,0.15);">
          <table role="presentation" width="100%" border="0" cellspacing="0" cellpadding="0"
            style="border-collapse: collapse;">
            <tr>
              <td style="height: 6px; background-color: #b91c1c;"></td>
            </tr>
            <tr>
              <td style="padding: 40px;">
                <p
                  style="margin: 0 0 12px; font-size: 12px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; color: #b91c1c;"
                  th:text="#{mail.paymentProofRefused.badge}">Payment proof refused</p>

                <h1
                  style="margin: 0 0 20px; font-size: 28px; font-weight: 800; line-height: 1.2; color: #0b1c32; letter-spacing: -0.02em;"
                  th:text="#{mail.paymentProofRefused.heading}">Your payment proof was refused</h1>

                <p style="margin: 0 0 16px; font-size: 16px; line-height: 1.6; color: #475569;"
                  th:text="#{mail.paymentProofRefused.body(${ownerName}, ${itemTitle})}">
                  The owner refused your payment proof.
                </p>

                <div style="margin: 0 0 24px; padding: 16px 20px; background-color: #fef2f2; border-left: 4px solid #b91c1c; border-radius: 8px;">
                  <p style="margin: 0 0 6px; font-size: 12px; font-weight: 700; text-transform: uppercase; color: #b91c1c;"
                    th:text="#{mail.paymentProofRefused.reasonLabel}">Reason</p>
                  <p style="margin: 0; font-size: 15px; line-height: 1.5; color: #1f2937; white-space: pre-wrap;"
                    th:text="${reason}">Reason text</p>
                </div>

                <p style="margin: 0 0 28px; font-size: 15px; line-height: 1.6; color: #475569;"
                  th:text="#{mail.paymentProofRefused.nextSteps}">
                  You can upload a new proof or reply with a clarification from your account.
                </p>

                <table role="presentation" border="0" cellspacing="0" cellpadding="0">
                  <tr>
                    <td>
                      <a th:href="${profileUrl}"
                        style="display: inline-block; padding: 14px 28px; border-radius: 9999px; background-color: #005da7; color: #ffffff; text-decoration: none; font-size: 15px; font-weight: 700;"
                        th:text="#{mail.paymentProofRefused.action}">Go to my account</a>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
          </table>
        </div>
      </td>
    </tr>
  </table>
</body>

</html>
