repos:
  - repo: local
    hooks:
      - id: java-maven-spotless-apply
        name: Applying Spotless (re-stages files, ignore Failed)
        entry: bash -c 'mvn -q spotless:apply && git add "$@"' --
        language: system
        files: \.java$
        pass_filenames: true
      - id: java-maven-test
        name: Running Maven tests...
        entry: mvn clean test
        language: system
        pass_filenames: false
      - id: java-maven-spotbugs
        name: Running SpotBugs checks...
        # clean compile avoids analyzing stale IDE output in target/classes (e.g. ECJ
        # "Unresolved compilation problem" stubs), which SpotBugs misreads as unused fields.
        entry: mvn -q -DskipTests clean compile spotbugs:check
        language: system
        pass_filenames: false
