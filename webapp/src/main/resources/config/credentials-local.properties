# Local development defaults (selected by credentials-selection.properties in local dev builds).
# Missing keys can fallback to credentials-production.properties when present.

# JDBC
jdbc.url=jdbc:postgresql://localhost/paw
jdbc.username=postgres
jdbc.password=postgres

# Flyway
flyway.outOfOrder=true

# Mail
mail.host=smtp.gmail.com
mail.port=587
mail.username=botecito.dev@gmail.com

# App URLs
app.baseUrl=http://localhost:8080

# Remember-me: private key used to sign the remember-me cookie signature.
# Local-dev value only; production uses its own secret in credentials-production.properties.
rememberMe.key=local-dev-remember-me-key
