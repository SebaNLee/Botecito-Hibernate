<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="#{mail.paymentProofSubmitted.title}">Payment proof submitted</title>
</head>

<body
  style="margin: 0; padding: 0; background-color: #0b1c32; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased;">
  <table role="presentation" width="100%" border="0" cellspacing="0" cellpadding="0"
    background="https://lh3.googleusercontent.com/aida-public/AB6AXuDZ5Kqd4fIKaFZvY-voq31ImCLWMzSnpeVGHpeEyaXd8kXtZiSFMnnKueB6HamkvchzGHcdtKloU7aDgr0MGxnoT_9ajOLMji0wPSC7yQ5emqwmkA73GZQCbn35o0UxfJBxyeJdhr-pzL1EEkw8LCF2DcdIJfVaWRcu-RoozLWsJ5ORG87g28BMPR4QUAoyt2LvbzVgTrE-Am1XsXBjgD1E9SEkR7OkE9HuWK0S0ggwcliJWi00H0b6vl-7cuPGDQ0UDBDUBgelxxN5"
    style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuDZ5Kqd4fIKaFZvY-voq31ImCLWMzSnpeVGHpeEyaXd8kXtZiSFMnnKueB6HamkvchzGHcdtKloU7aDgr0MGxnoT_9ajOLMji0wPSC7yQ5emqwmkA73GZQCbn35o0UxfJBxyeJdhr-pzL1EEkw8LCF2DcdIJfVaWRcu-RoozLWsJ5ORG87g28BMPR4QUAoyt2LvbzVgTrE-Am1XsXBjgD1E9SEkR7OkE9HuWK0S0ggwcliJWi00H0b6vl-7cuPGDQ0UDBDUBgelxxN5'); background-size: cover; background-position: center;">
    <tr>
      <td align="center" style="padding: 60px 24px; background-color: rgba(11, 28, 50, 0.5);">
        <div
          style="max-width: 600px; margin: 0 auto; background-color: #ffffff; border-radius: 24px; overflow: hidden; border: 1px solid #e2e8f0; box-shadow: 0 24px 48px rgba(0,0,0,0.15);">
          <table role="presentation" width="100%" border="0" cellspacing="0" cellpadding="0"
            style="border-collapse: collapse;">
            <tr>
              <td style="height: 6px; background-color: #005da7;"></td>
            </tr>
            <tr>
              <td style="padding: 40px;">
                <p
                  style="margin: 0 0 12px; font-size: 12px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; color: #005da7;"
                  th:text="#{mail.paymentProofSubmitted.badge}">Payment proof</p>

                <h1
                  style="margin: 0 0 20px; font-size: 28px; font-weight: 800; line-height: 1.2; color: #0b1c32; letter-spacing: -0.02em;"
                  th:text="#{mail.paymentProofSubmitted.heading}">Payment proof received</h1>

                <p style="margin: 0 0 24px; font-size: 16px; line-height: 1.6; color: #475569;"
                  th:text="#{mail.paymentProofSubmitted.body(${requesterName}, ${itemTitle})}">
                  The requester uploaded a payment proof.
                </p>

                <div
                  style="background-color: #f8fafc; border-radius: 16px; border: 1px solid #e2e8f0; padding: 16px; margin-bottom: 28px;">
                  <img th:if="${hasProofImage}" th:src="${proofImageSrc}" alt="Payment proof"
                    style="display: block; width: 100%; height: auto; border-radius: 12px;" />
                  <p th:if="${!hasProofImage}"
                    style="margin: 0; font-size: 14px; line-height: 1.6; color: #64748b;"
                    th:text="#{mail.paymentProofSubmitted.previewUnavailable}">A preview is not available for this file type. Review it from your account.</p>
                </div>

                <table role="presentation" border="0" cellspacing="0" cellpadding="0">
                  <tr>
                    <td>
                      <a th:href="${profileUrl}"
                        style="display: inline-block; padding: 14px 28px; border-radius: 9999px; background-color: #005da7; color: #ffffff; text-decoration: none; font-size: 15px; font-weight: 700;"
                        th:text="#{mail.paymentProofSubmitted.action}">Go to my account</a>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
          </table>
        </div>
      </td>
    </tr>
  </table>
</body>

</html>
